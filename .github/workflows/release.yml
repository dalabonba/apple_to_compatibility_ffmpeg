name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt5

      - name: Build executable with PyInstaller
        run: |
          pyinstaller .github/apple_to_compatibility.spec

      - name: Create release archive
        shell: pwsh
        run: |
          $distPath = "dist/apple_to_compatibility"
          $archivePath = "apple_to_compatibility-${{ github.ref_name }}.zip"
          Compress-Archive -Path $distPath -DestinationPath $archivePath -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apple_to_compatibility-${{ github.ref_name }}.zip
